spring:
  application:
    name: rag-assistant

  # Optional local .env file (git-ignored) for DB_* values.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag_assistant}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: rag

  # Liquibase creates the "rag" schema itself (see 001 changelog).
  # Its own tracking tables stay in "public" because "rag" does not exist on the first run.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    liquibase-schema: public
